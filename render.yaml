# Web frontend is published separately through Sites.
services:
  - type: web
    name: groceries-tracker-api
    runtime: node
    region: virginia
    plan: 0.5c-512mb
    branch: main
    buildCommand: npm install --global pnpm@11.25.0 && pnpm install --frozen-lockfile --filter @workspace/api-server... --prod=false && pnpm --filter @workspace/api-server build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: GROCERIES_DATA_DIR
        value: /var/data/groceries
    disk:
      name: groceries-data
      mountPath: /var/data
      sizeGB: 1
